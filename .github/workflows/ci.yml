name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build -o dist-ci/ ./cmd/lootmap
      - name: smoke (--help, doctor)
        shell: bash
        run: |
          ./dist-ci/lootmap --help
          ./dist-ci/lootmap doctor

  # Real network sandbox (SPEC.md test strategy, decision 17): Linux only.
  # Modules are downloaded first; tests and the binary then run in a user
  # namespace with no network, so any connection attempt fails.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: prefetch
        run: |
          go mod download
          go build -o dist-ci/ ./cmd/lootmap
          go test -count=1 -run '^$' ./...
      - name: test without network
        env:
          GOPROXY: "off"
          GOFLAGS: "-mod=mod"
        run: unshare --user --map-root-user --net go test -count=1 ./...
      - name: smoke without network
        run: |
          unshare --user --map-root-user --net ./dist-ci/lootmap --help
          unshare --user --map-root-user --net ./dist-ci/lootmap doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
