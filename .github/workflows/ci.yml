name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build -o dist-ci/ ./cmd/lootmap
      - name: smoke (--help, doctor)
        shell: bash
        run: |
          ./dist-ci/lootmap --help
          ./dist-ci/lootmap doctor

  # Real network sandbox (SPEC.md test strategy, decision 17): Linux only.
  # Modules are downloaded first; tests and the binary then run in a network
  # namespace that has no usable interfaces, so any connection attempt fails.
  # Ubuntu 24.04 runners block unprivileged user namespaces (AppArmor), so the
  # namespace is created with sudo and setpriv drops straight back to the
  # runner user: nothing under test runs as root.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: prefetch
        run: |
          go mod download
          go build -o dist-ci/ ./cmd/lootmap
          go test -count=1 -run '^$' ./...
      - name: write sandbox helper
        run: |
          cat > "$RUNNER_TEMP/nonet" <<EOF
          #!/bin/sh
          # Usage: nonet <command...>  runs the command as $(id -un) without network.
          exec sudo unshare --net -- setpriv --reuid=$(id -u) --regid=$(id -g) --init-groups env PATH="$PATH" HOME="$HOME" GOPATH="$(go env GOPATH)" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" GOTOOLCHAIN=local GOPROXY=off GOFLAGS=-mod=mod "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/nonet"
      - name: prove the sandbox has no network
        run: |
          "$RUNNER_TEMP/nonet" true
          test "$("$RUNNER_TEMP/nonet" id -u)" = "$(id -u)"
          if "$RUNNER_TEMP/nonet" curl -sS --max-time 5 https://proxy.golang.org >/dev/null 2>&1; then
            echo "sandbox still has network access"; exit 1
          fi
      - name: test without network
        run: '"$RUNNER_TEMP/nonet" go test -count=1 ./...'
      - name: smoke without network
        run: |
          "$RUNNER_TEMP/nonet" ./dist-ci/lootmap --help
          "$RUNNER_TEMP/nonet" ./dist-ci/lootmap doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@cee1b8e05ae5b2593a75e197229729eabaa9f8ec # v0.20.2
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
